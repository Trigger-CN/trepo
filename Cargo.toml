[package]
name = "trepo"
version = "0.5.0"
edition = "2021"
rust-version = "1.81"
description = "A terminal workspace for Android Repo and Git repositories"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
flate2 = "1.0"
ratatui = "0.29"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
self-replace = "1.5"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.15"
tokio = { version = "1.43", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"
ureq = { version = "2.12", default-features = false, features = ["json", "native-tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

[profile.release]
lto = "thin"
strip = true
